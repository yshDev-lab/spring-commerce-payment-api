spring:
  application:
    name: spring-commerce-payment-api
  datasource:
    url: jdbc:h2:mem:commercedb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

pg:
  webhook-secret: ${PG_WEBHOOK_SECRET:kmong-portfolio-hmac-secret-key-2026}
  fee-rate: 0.033
